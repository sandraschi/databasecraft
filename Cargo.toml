[workspace]
members = [
    "crates/databasecraft-core",
    "crates/databasecraft-store",
    "crates/databasecraft-mcp",
    "crates/databasecraft-app",
]
resolver = "2"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
eframe = "0.37"
